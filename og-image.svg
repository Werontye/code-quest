<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="630" fill="#0f0f1a"/>

  <!-- Gradient orbs -->
  <circle cx="200" cy="100" r="300" fill="url(#grad1)" opacity="0.3"/>
  <circle cx="1000" cy="500" r="250" fill="url(#grad2)" opacity="0.3"/>

  <!-- Grid pattern -->
  <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
    <path d="M 50 0 L 0 0 0 50" fill="none" stroke="#ffffff" stroke-width="0.5" opacity="0.05"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Logo -->
  <g transform="translate(500, 180)">
    <rect width="80" height="80" rx="16" fill="url(#logoGrad)"/>
    <path d="M25 30L15 40L25 50" stroke="white" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M55 30L65 40L55 50" stroke="white" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M45 20L35 60" stroke="white" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Title -->
  <text x="600" y="320" font-family="Inter, Arial, sans-serif" font-size="72" font-weight="800" fill="white" text-anchor="middle">
    CodeQuest
  </text>

  <!-- Subtitle -->
  <text x="600" y="380" font-family="Inter, Arial, sans-serif" font-size="28" fill="#a0a0a0" text-anchor="middle">
    Изучай Web-разработку играя
  </text>

  <!-- Features -->
  <g transform="translate(250, 450)">
    <rect x="0" y="0" width="140" height="40" rx="20" fill="#6c63ff" opacity="0.2"/>
    <text x="70" y="27" font-family="Inter, Arial, sans-serif" font-size="16" fill="#6c63ff" text-anchor="middle" font-weight="600">300+ уровней</text>
  </g>
  <g transform="translate(420, 450)">
    <rect x="0" y="0" width="160" height="40" rx="20" fill="#00d26a" opacity="0.2"/>
    <text x="80" y="27" font-family="Inter, Arial, sans-serif" font-size="16" fill="#00d26a" text-anchor="middle" font-weight="600">9 технологий</text>
  </g>
  <g transform="translate(610, 450)">
    <rect x="0" y="0" width="140" height="40" rx="20" fill="#ffc107" opacity="0.2"/>
    <text x="70" y="27" font-family="Inter, Arial, sans-serif" font-size="16" fill="#ffc107" text-anchor="middle" font-weight="600">Бесплатно</text>
  </g>
  <g transform="translate(780, 450)">
    <rect x="0" y="0" width="170" height="40" rx="20" fill="#ff6b6b" opacity="0.2"/>
    <text x="85" y="27" font-family="Inter, Arial, sans-serif" font-size="16" fill="#ff6b6b" text-anchor="middle" font-weight="600">Интерактивно</text>
  </g>

  <!-- Tech icons row -->
  <g transform="translate(350, 520)" opacity="0.6">
    <text x="0" y="20" font-family="monospace" font-size="14" fill="#e44d26">HTML</text>
    <text x="60" y="20" font-family="monospace" font-size="14" fill="#264de4">CSS</text>
    <text x="110" y="20" font-family="monospace" font-size="14" fill="#f7df1e">JS</text>
    <text x="150" y="20" font-family="monospace" font-size="14" fill="#3178c6">TS</text>
    <text x="190" y="20" font-family="monospace" font-size="14" fill="#61dafb">React</text>
    <text x="260" y="20" font-family="monospace" font-size="14" fill="#68a063">Node</text>
    <text x="320" y="20" font-family="monospace" font-size="14" fill="#3776ab">Python</text>
    <text x="400" y="20" font-family="monospace" font-size="14" fill="#f05032">Git</text>
    <text x="450" y="20" font-family="monospace" font-size="14" fill="#a259ff">Figma</text>
  </g>

  <!-- Gradients -->
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6c63ff"/>
      <stop offset="100%" stop-color="#9b59b6"/>
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d26a"/>
      <stop offset="100%" stop-color="#48dbfb"/>
    </linearGradient>
    <linearGradient id="logoGrad" x1="0" y1="0" x2="80" y2="80" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6c63ff"/>
      <stop offset="1" stop-color="#9b59b6"/>
    </linearGradient>
  </defs>
</svg>
