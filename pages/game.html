<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Уровень - CodeQuest</title>
    <link rel="icon" type="image/svg+xml" href="../favicon.svg">
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/components/editor.css">
    <link rel="stylesheet" href="../css/components/game.css">
    <link rel="stylesheet" href="../css/components/progress.css">
    <link rel="stylesheet" href="../css/components/animations.css">
    <link rel="stylesheet" href="../css/themes/html-theme.css">
    <link rel="stylesheet" href="../css/themes/css-theme.css">
    <link rel="stylesheet" href="../css/themes/js-theme.css">
    <link rel="stylesheet" href="../css/themes/figma-theme.css">
</head>
<body>
    <!-- Animated Background -->
    <div class="animated-bg">
        <div class="gradient-orbs">
            <div class="orb orb-1"></div>
            <div class="orb orb-2"></div>
            <div class="orb orb-3"></div>
        </div>
        <div class="grid-lines"></div>
    </div>

    <div class="app game-page" id="app">
        <!-- Header -->
        <header class="header">
            <div class="header__logo">
                <a href="../index.html" class="logo-link">
                    <svg class="logo-svg" width="28" height="28" viewBox="0 0 32 32" fill="none"><rect width="32" height="32" rx="8" fill="url(#lg)"/><path d="M10 12L6 16L10 20M22 12L26 16L22 20M18 8L14 24" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><defs><linearGradient id="lg" x1="0" y1="0" x2="32" y2="32"><stop stop-color="#6c63ff"/><stop offset="1" stop-color="#9b59b6"/></linearGradient></defs></svg>
                    <span class="logo-text">CodeQuest</span>
                </a>
            </div>
            <div class="level-counter" id="levelCounter">
                Уровень 1 / 35
            </div>
            <nav class="header__nav">
                <a href="theory.html" class="nav-link nav-link--theory">
                    <span class="nav-icon">&#128218;</span>
                    <span>Теория</span>
                </a>
                <a href="profile.html" class="nav-link">
                    <span class="nav-icon">&#9733;</span>
                    <span class="nav-xp" id="headerXP">0 XP</span>
                </a>
            </nav>
        </header>

        <!-- Game Container -->
        <main class="game-container fade-in-up">
            <!-- Left Panel - Instructions & Visual -->
            <div class="game-left">
                <!-- Level Info -->
                <div class="level-info" id="levelInfo">
                    <div class="level-header">
                        <span class="level-number" id="levelNumber">Уровень 1</span>
                        <div class="level-difficulty" id="levelDifficulty">
                            <!-- Stars will be inserted by JS -->
                        </div>
                    </div>
                    <h2 class="level-title" id="levelTitle">Загрузка...</h2>
                    <p class="level-description" id="levelDescription"></p>

                    <div class="task-box">
                        <span class="task-label" data-i18n="game.task">Задание</span>
                        <p class="task-text" id="taskText"></p>
                    </div>
                </div>

                <!-- Hint Box (hidden by default) -->
                <div class="hint-box hidden" id="hintBox">
                    <div class="hint-header">
                        <span class="hint-icon">&#128161;</span>
                        <span data-i18n="game.hint">Подсказка</span>
                    </div>
                    <p class="hint-text" id="hintText"></p>
                </div>
            </div>

            <!-- Right Panel - Editor -->
            <div class="game-right">
                <!-- Code Editor -->
                <div class="code-editor" id="codeEditor">
                    <div class="editor-header">
                        <div class="editor-tabs">
                            <button class="editor-tab active" data-tab="code" data-i18n="game.code">Код</button>
                        </div>
                        <div class="editor-actions">
                            <button class="btn btn-hint" id="btnHint" title="Показать подсказку">
                                &#128161; <span data-i18n="game.hint">Подсказка</span>
                            </button>
                            <button class="btn btn-reset" id="btnReset" title="Сбросить код">
                                &#8634; <span data-i18n="game.reset">Сбросить</span>
                            </button>
                        </div>
                    </div>

                    <div class="editor-body">
                        <!-- Fill-blank mode -->
                        <div class="fill-blank-editor" id="fillBlankEditor">
                            <div class="code-template" id="codeTemplate">
                                <!-- Template with inputs will be inserted by JS -->
                            </div>
                        </div>

                        <!-- Full editor mode -->
                        <div class="full-editor hidden" id="fullEditor">
                            <div class="line-numbers" id="lineNumbers">1</div>
                            <div class="code-input-wrapper">
                                <textarea class="code-input" id="codeInput" spellcheck="false" placeholder="Напиши свой код здесь..."></textarea>
                            </div>
                        </div>
                    </div>

                    <div class="editor-footer">
                        <div class="editor-status">
                            <span class="status-icon" id="statusIcon"></span>
                            <span id="statusText" data-i18n="game.ready">Готов к проверке</span>
                        </div>
                        <button class="btn btn-run" id="btnRun">
                            &#9654; <span data-i18n="game.check">Проверить</span>
                        </button>
                    </div>
                </div>

            </div>
        </main>

        <!-- Navigation -->
        <nav class="game-nav">
            <button class="nav-btn" id="btnPrev" disabled>
                &#9664; <span data-i18n="game.back">Назад</span>
            </button>
            <a href="#" class="nav-btn" id="btnLevels">
                &#9776; <span data-i18n="game.all_levels">Все уровни</span>
            </a>
            <button class="nav-btn" id="btnNext">
                <span data-i18n="game.next">Далее</span> &#9654;
            </button>
        </nav>

        <!-- Success Overlay (hidden by default) -->
        <div class="success-overlay hidden" id="successOverlay">
            <div class="success-content">
                <div class="success-icon">&#127881;</div>
                <h2 class="success-title" data-i18n="success.title">Отлично!</h2>
                <p class="success-subtitle" data-i18n="success.subtitle">Уровень пройден</p>
                <div class="success-stats">
                    <div class="success-stat">
                        <span class="stat-value" id="earnedXP">+10</span>
                        <span class="stat-label" data-i18n="success.xp">XP</span>
                    </div>
                    <div class="success-stat">
                        <span class="stat-value" id="attemptCount">1</span>
                        <span class="stat-label" data-i18n="success.attempt">Попытка</span>
                    </div>
                </div>
                <div class="success-actions">
                    <button class="btn btn-next" id="btnNextLevel">
                        <span data-i18n="success.next">Следующий уровень</span> &#9654;
                    </button>
                    <button class="btn btn-retry" id="btnRetry" data-i18n="success.retry">
                        Попробовать ещё
                    </button>
                </div>
            </div>
        </div>

        <!-- Achievement Popup (hidden by default) -->
        <div class="achievement-popup hidden" id="achievementPopup">
            <span class="achievement-icon">&#127942;</span>
            <div class="achievement-info">
                <h4>Достижение!</h4>
                <p id="achievementName">Первые шаги</p>
            </div>
        </div>
    </div>

    <style>
        .logo-link {
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
        }
    </style>

    <script src="../js/modules/storage.js"></script>
    <script src="../js/modules/i18n.js"></script>
    <script src="../js/levels/html-levels.js"></script>
    <script src="../js/levels/css-levels.js"></script>
    <script src="../js/levels/js-levels.js"></script>
    <script src="../js/levels/ts-levels.js"></script>
    <script src="../js/levels/react-levels.js"></script>
    <script src="../js/levels/node-levels.js"></script>
    <script src="../js/levels/figma-levels.js"></script>
    <script src="../js/modules/codeValidator.js"></script>
    <script src="../js/modules/achievements.js"></script>
    <script src="../js/modules/levelManager.js"></script>
    <script>
        // Initialize i18n first
        document.addEventListener('DOMContentLoaded', () => {
            i18n.init();
            i18n.updatePage();
        });

    </script>
</body>
</html>
